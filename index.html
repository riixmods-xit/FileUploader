<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RiiX Uploader</title>
<style>
  :root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --blue-light: #60a5fa;
    --ink: #0a0a0a;
    --paper: #f5f5f5;
    --white: #ffffff;
    --yellow: #facc15;
    --red: #ef4444;
    --green: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Courier New', ui-monospace, monospace;
    background: var(--blue);
    background-image:
      linear-gradient(0deg, rgba(0,0,0,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .shell {
    width: 100%;
    max-width: 620px;
  }
  .brand {
    display: inline-block;
    background: var(--yellow);
    color: var(--ink);
    border: 4px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    padding: 10px 18px;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transform: rotate(-1.5deg);
    margin-bottom: 28px;
  }
  .card {
    background: var(--white);
    border: 4px solid var(--ink);
    box-shadow: 10px 10px 0 var(--ink);
    padding: 28px;
  }
  h1 {
    font-size: 26px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 4px solid var(--ink);
    padding-bottom: 10px;
    margin-bottom: 20px;
  }
  .drop {
    border: 4px dashed var(--ink);
    background: var(--paper);
    padding: 34px 20px;
    text-align: center;
    cursor: pointer;
    transition: background 0.12s ease, transform 0.12s ease;
    position: relative;
  }
  .drop:hover, .drop.drag {
    background: var(--blue-light);
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .drop .big {
    font-size: 40px;
    font-weight: 900;
    line-height: 1;
    color: var(--blue-dark);
  }
  .drop .small {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .drop input[type="file"] { display: none; }
  .hint {
    margin-top: 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    opacity: 0.7;
  }
  .field { margin-top: 18px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    border: 4px solid var(--ink);
    background: var(--white);
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    outline: none;
    box-shadow: 4px 4px 0 var(--ink);
  }
  input[type="text"]:focus { background: #eff6ff; }
  .btn {
    display: inline-block;
    width: 100%;
    margin-top: 22px;
    border: 4px solid var(--ink);
    background: var(--blue);
    color: var(--white);
    font-family: inherit;
    font-size: 16px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 14px;
    cursor: pointer;
    box-shadow: 6px 6px 0 var(--ink);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .btn:hover:not(:disabled) { transform: translate(-2px,-2px); box-shadow: 8px 8px 0 var(--ink); }
  .btn:active:not(:disabled) { transform: translate(4px,4px); box-shadow: 2px 2px 0 var(--ink); }
  .btn:disabled { background: #94a3b8; cursor: not-allowed; }
  .status {
    margin-top: 18px;
    border: 4px solid var(--ink);
    background: var(--yellow);
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 800;
    display: none;
    word-break: break-all;
  }
  .status.show { display: block; }
  .status.err { background: var(--red); color: var(--white); }
  .status.ok { background: var(--green); color: var(--white); }
  .status a { color: inherit; font-weight: 900; }
  .link {
    margin-top: 14px;
    font-size: 13px;
    font-weight: 700;
  }
  .link a { color: var(--blue-dark); }
  .progress {
    margin-top: 12px;
    height: 18px;
    border: 4px solid var(--ink);
    background: var(--paper);
    display: none;
  }
  .progress.show { display: block; }
  .bar {
    height: 100%;
    width: 0%;
    background: repeating-linear-gradient(45deg, var(--blue), var(--blue) 10px, var(--blue-light) 10px, var(--blue-light) 20px);
    transition: width 0.15s ease;
  }
  footer {
    margin-top: 26px;
    text-align: center;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink);
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="brand">RiiX Uploader</div>
    <div class="card">
      <h1>Upload File</h1>

      <div class="drop" id="drop">
        <input type="file" id="file" />
        <div class="big">[ + ]</div>
        <div class="small">Select your files</div>
        <div class="hint">apk · zip · 7z · txt · json · dll</div>
      </div>

      <div class="field">
        <label for="custom">Custom name (optional)</label>
        <input type="text" id="custom" placeholder="NamaCustom" maxlength="64" />
      </div>

      <button class="btn" id="upload" disabled>Upload</button>

      <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
      <div class="status" id="status"></div>

      <div class="link" id="result"></div>
    </div>
    <footer>RiiX Uploader · Neubrutalist Blue</footer>
  </div>

<script>
(function () {
  const DROP = document.getElementById('drop');
  const INPUT = document.getElementById('file');
  const CUSTOM = document.getElementById('custom');
  const BTN = document.getElementById('upload');
  const STATUS = document.getElementById('status');
  const RESULT = document.getElementById('result');
  const PROG = document.getElementById('progress');
  const BAR = document.getElementById('bar');

  const ALLOWED = ['.apk','.zip','.7z','.txt','.json','.dll'];
  const MAX_BYTES = 4 * 1024 * 1024; // 4 MB — Vercel serverless body limit
  const BASE = location.origin;

  function setStatus(msg, kind) {
    STATUS.className = 'status show' + (kind ? ' ' + kind : '');
    STATUS.textContent = msg;
  }
  function clearStatus() {
    STATUS.className = 'status';
    STATUS.textContent = '';
    RESULT.textContent = '';
    PROG.className = 'progress';
    BAR.style.width = '0%';
  }
  function extOf(name) {
    const i = name.lastIndexOf('.');
    return i < 0 ? '' : name.slice(i).toLowerCase();
  }
  function sanitize(name) {
    return name.replace(/[^\w.\-]+/g, '_').slice(0, 64);
  }

  DROP.addEventListener('click', () => INPUT.click());
  DROP.addEventListener('dragover', (e) => {
    e.preventDefault();
    DROP.classList.add('drag');
  });
  DROP.addEventListener('dragleave', () => DROP.classList.remove('drag'));
  DROP.addEventListener('drop', (e) => {
    e.preventDefault();
    DROP.classList.remove('drag');
    if (e.dataTransfer.files.length) {
      INPUT.files = e.dataTransfer.files;
      sync();
    }
  });
  INPUT.addEventListener('change', sync);

  function sync() {
    clearStatus();
    const f = INPUT.files[0];
    if (!f) {
      BTN.disabled = true;
      DROP.querySelector('.small').textContent = 'Select your files';
      return;
    }
    DROP.querySelector('.small').textContent = f.name + '  (' + (f.size/1024).toFixed(1) + ' KB)';
    if (!ALLOWED.includes(extOf(f.name))) {
      setStatus('Tipe file tidak didukung. Gunakan: ' + ALLOWED.join(' '), 'err');
      BTN.disabled = true;
      return;
    }
    if (f.size > MAX_BYTES) {
      setStatus('Ukuran > 4 MB. Vercel serverless body limit.', 'err');
      BTN.disabled = true;
      return;
    }
    BTN.disabled = false;
  }

  BTN.addEventListener('click', () => {
    const f = INPUT.files[0];
    if (!f) return;
    BTN.disabled = true;
    PROG.className = 'progress show';
    BAR.style.width = '0%';
    RESULT.textContent = '';
    setStatus('Uploading ' + f.name + ' ...');

    const form = new FormData();
    form.append('file', f, f.name);
    form.append('custom', CUSTOM.value.trim());

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable) {
        BAR.style.width = Math.round((ev.loaded / ev.total) * 100) + '%';
      }
    };
    xhr.onload = () => {
      let res = null;
      try { res = JSON.parse(xhr.responseText); } catch (_) {}
      if (xhr.status >= 200 && xhr.status < 300 && res && res.ok) {
        setStatus('Upload sukses.', 'ok');
        const custom = (res.custom || sanitize(f.name)).replace(/[#\s]+/g, '_');
        const target = BASE + '/#' + encodeURIComponent(custom) + '/' + encodeURIComponent(f.name);
        const a = document.createElement('a');
        a.href = target;
        a.textContent = target;
        RESULT.textContent = 'URL: ';
        RESULT.appendChild(a);
        history.replaceState(null, '', '#' + encodeURIComponent(custom) + '/' + encodeURIComponent(f.name));
      } else {
        setStatus('Gagal: ' + (res && res.error ? res.error : ('HTTP ' + xhr.status)), 'err');
      }
      BTN.disabled = false;
    };
    xhr.onerror = () => {
      setStatus('Network error. Cek endpoint /api/upload.', 'err');
      BTN.disabled = false;
    };
    xhr.send(form);
  });

  // Deep link handler: #NamaCustom/NamaFile
  window.addEventListener('load', () => {
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    if (h && h.includes('/')) {
      const [custom, name] = h.split('/');
      CUSTOM.value = custom || '';
      setStatus('Link: ' + custom + '/' + name + ' — file belum di-upload di sesi ini.', '');
    }
  });
})();
</script>
</body>
  </html>
